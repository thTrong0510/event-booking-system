<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Admin - Ticket System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .btn-login {
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            padding: 12px;
        }

        .btn-login:hover {
            background: #1a252f;
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-card card p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-uppercase text-primary"><i class="bi bi-shield-lock-fill"></i> Admin Panel</h3>
            <p class="text-muted small">Vui lòng đăng nhập để quản trị hệ thống</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i
                            class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="username" class="form-control border-start-0"
                        placeholder="admin@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••"
                        required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 fw-bold shadow-sm mb-3">ĐĂNG NHẬP</button>

<!--            <div class="text-center small">
                <span class="text-muted">Chưa có tài khoản?</span>
                <a th:href="@{/admin/register}" class="text-decoration-none fw-bold">Đăng ký Admin</a>
            </div>-->
        </form>
    </div>

</body>

</html>
