<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký Admin - Ticket System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin: auto;
        }
    </style>
</head>

<body>

    <div class="register-card card p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-uppercase text-success"><i class="bi bi-person-plus-fill"></i> Tạo tài khoản Admin
            </h3>
            <p class="text-muted small">Thông tin sẽ được lưu trữ bảo mật</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/register}" th:object="${registerDTO}" method="post" enctype="multipart/form-data">
            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label small fw-bold">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                        th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                        placeholder="Nhập tên đầy đủ" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold">Email công việc</label>
                    <input type="email" th:field="*{email}" class="form-control"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                        placeholder="admin@domain.com">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" th:field="*{password}" class="form-control"
                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="••••••••">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold">Xác nhận mật khẩu</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"
                        th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                        placeholder="••••••••">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold">Phân quyền tài khoản (Role)</label>
                    <select th:field="*{roleId}" class="form-select"
                        th:classappend="${#fields.hasErrors('roleId')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn vai trò hệ thống --</option>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label small fw-bold">Chọn Ảnh Đại Diện (Avatar)</label>
                    <input type="file" th:field="*{avatarUrl}" class="form-control"
                        th:classappend="${#fields.hasErrors('avatarUrl')} ? 'is-invalid' : ''"
                        accept="image/png, image/jpeg, image/jpg">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('avatarUrl')}" th:errors="*{avatarUrl}">
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm">ĐĂNG KÝ NGAY</button>
                </div>

                <div class="col-12 text-center small">
                    <span class="text-muted">Đã có tài khoản?</span>
                    <a th:href="@{/admin/login}" class="text-decoration-none fw-bold">Đăng nhập</a>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
