<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, title)">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:replace="${title}">Hệ Thống Quản Trị Viên</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <style>
            body {
                font-size: .875rem;
                background-color: #f8f9fa;
            }
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 100;
                padding: 48px 0 0;
            }
            @media (max-width: 767.98px) {
                .sidebar {
                    top: 5rem;
                }
            }
            .sidebar-sticky {
                height: calc(100vh - 48px);
                overflow-x: hidden;
                overflow-y: auto;
            }
            .navbar-brand {
                padding-top: .75rem;
                padding-bottom: .75rem;
                background-color: rgba(0,0,0,.25);
                box-shadow: inset -1px 0 0 rgba(0,0,0,.25);
            }
            .hover-bg:hover {
                background-color: #f1f3f5;
                color: #0d6efd !important;
            }
            .card {
                border: none;
                border-radius: 8px;
            }
            /* Active menu item */
            .active-menu {
                background: linear-gradient(135deg, #0d6efd, #0a58ca);
                color: #fff !important;
                font-weight: 500;
                box-shadow: 0 2px 8px rgba(13, 110, 253, 0.35);
            }

            /* Hover effect */
            .hover-bg {
                transition: background-color 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
            }
            .hover-bg:hover {
                background-color: #e9f0ff;
                color: #0d6efd !important;
                padding-left: 1.25rem !important;
            }
            .hover-bg:hover i {
                transform: scale(1.15);
                transition: transform 0.15s ease;
            }

            /* Sidebar section label */
            .sidebar .text-uppercase {
                pointer-events: none;
            }
        </style>
    </head>
    <body>

        <!-- Header: dùng th:replace trên chính thẻ placeholder cùng loại -->
        <header th:replace="~{admin/fragments/header :: admin-header}">
            placeholder
        </header>

        <div class="container-fluid">
            <div class="row">

                <nav th:replace="~{admin/fragments/sidebar :: admin-sidebar}">
                    placeholder
                </nav>

                <!-- Main content -->
                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                    <th:block th:replace="${content}"></th:block>
                </main>

            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{admin/fragments/footer :: admin-footer}">
            placeholder
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
