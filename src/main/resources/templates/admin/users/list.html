<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: main-layout(~{::main-content}, ~{::title})}">

<head>
    <title>Quản Lý Người Dùng - Ticket Booking</title>
    <style>
        .detail-avatar {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

    <div th:fragment="main-content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
            <h1 class="h2"><i class="bi bi-people-fill text-primary"></i> Quản Lý Hệ Thống Người Dùng</h1>
            <span class="badge bg-dark p-2" th:text="${'Tổng cộng: ' + totalElements + ' thành viên'}">0</span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/admin/users}" method="get" class="row g-3">
                    <div class="col-md-6">
                        <input type="text" name="search" th:value="${search}" class="form-control"
                            placeholder="Tìm kiếm theo Tên hoặc Email...">
                    </div>
                    <div class="col-md-3">
                        <select name="roleId" class="form-select">
                            <option value="">-- Tất cả vai trò --</option>
                            <option th:each="r : ${allRoles}" th:value="${r.id}" th:text="${r.name}"
                                th:selected="${roleId == r.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Lọc dữ
                            liệu</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Ảnh</th>
                            <th>Họ Và Tên</th>
                            <th>Email</th>
                            <th>Vai Trò</th>
                            <th>Trạng Thái</th>
                            <th class="text-center">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td>
                                <div class="d-inline-block bg-light border rounded-circle overflow-hidden shadow-sm"
                                    style="width: 40px; height: 40px;">
                                    <img th:src="${user.avatarUrl}" class="user-avatar img-fluid" alt="user Avatar">
                                </div>
                            </td>
                            <td th:text="${user.fullName}" class="fw-bold text-dark">Nguyen Van A</td>
                            <td th:text="${user.email}">a@example.com</td>
                            <td><span class="badge bg-info text-dark" th:text="${user.roleName}">Attendee</span></td>
                            <td>
                                <span th:if="${user.active}" class="badge bg-success">Hoạt Động</span>
                                <span th:if="${!user.active}" class="badge bg-danger">Đang Khóa</span>
                            </td>
                            <td class="text-center">
                                <div class="d-inline-flex gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary" th:data-id="${user.id}"
                                        th:data-name="${user.fullName}" th:data-email="${user.email}"
                                        th:data-role="${user.roleId}" th:data-status="${user.active}"
                                        th:data-avatar="${user.avatarUrl}" onclick="openDetailModal(this)">
                                        <i class="bi bi-pencil-square"></i> Chi tiết / Sửa
                                    </button>

                                    <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post"
                                        class="m-0"
                                        th:onsubmit="return confirm([[${user.active} ? 'Bạn có chắc chắn muốn KHÓA tài khoản này?' : 'Bạn có chắc chắn muốn MỞ KHÓA tài khoản này?']]);">

                                        <input type="hidden" name="search" th:value="${search}" />
                                        <input type="hidden" name="roleId" th:value="${roleId}" />
                                        <input type="hidden" name="page" th:value="${currentPage}" />

                                        <button type="submit" class="btn btn-sm"
                                            th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-success'"
                                            th:title="${user.active} ? 'Chặn tài khoản này' : 'Kích hoạt lại tài khoản'">
                                            <i th:class="${user.active} ? 'bi bi-lock-fill' : 'bi bi-unlock-fill'"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav th:if="${totalPages > 1}" class="mt-3" aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/admin/users(page=${currentPage - 1}, search=${search}, roleId=${roleId})}">Trước</a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                                th:href="@{/admin/users(page=${i}, search=${search}, roleId=${roleId})}"
                                th:text="${i}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/admin/users(page=${currentPage + 1}, search=${search}, roleId=${roleId})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="userModalLabel"><i class="bi bi-person-badge-fill"></i> Chi Tiết
                            Thành Viên</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-shadow="none"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="updateRoleForm" method="post">
                        <input type="hidden" name="search" th:value="${search}" />
                        <input type="hidden" name="roleId" th:value="${roleId}" />
                        <input type="hidden" name="page" th:value="${currentPage}" />

                        <div class="modal-body text-center">

                            <div class="mb-3 d-inline-block bg-light border rounded-circle overflow-hidden shadow-sm"
                                style="width: 100px; height: 100px;">
                                <img id="modalAvatar" src="" class="organizer-avatar img-fluid" alt="Organizer Avatar">
                            </div>
                            <h4 id="modalName" class="fw-bold mb-1">Nguyen Van A</h4>
                            <p id="modalEmail" class="text-muted small mb-4">email@example.com</p>
                            <hr>
                            <div class="text-start mb-3">
                                <label class="form-label small fw-bold text-secondary">Trạng Thái Tài Khoản</label>
                                <div><span id="modalStatusBadge" class="badge">Hoạt động</span></div>
                            </div>
                            <div class="text-start mb-3">
                                <label class="form-label small fw-bold text-secondary">Thay Đổi Vai Trò Hệ Thống
                                    (Role)</label>
                                <select name="newRoleId" id="modalRoleSelect" class="form-select" required>
                                    <option th:each="r : ${allRoles}" th:value="${r.id}" th:text="${r.name}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-save"></i> Lưu Thay
                                Đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function openDetailModal(button) {
                const id = button.getAttribute('data-id');
                const name = button.getAttribute('data-name');
                const email = button.getAttribute('data-email');
                const roleId = button.getAttribute('data-role');
                const isActive = button.getAttribute('data-status') === 'true';
                let avatar = button.getAttribute('data-avatar');

                if (!avatar || avatar === 'null' || avatar.trim() === '') {
                    avatar = 'https://res.cloudinary.com/dsm5pbyf2/image/upload/v1700123456/default_avatar_jxfp3k.png';
                }

                document.getElementById('modalAvatar').src = avatar;
                document.getElementById('modalName').textContent = name;
                document.getElementById('modalEmail').textContent = email;
                document.getElementById('modalRoleSelect').value = roleId;

                const badge = document.getElementById('modalStatusBadge');
                if (isActive) {
                    badge.className = 'badge bg-success';
                    badge.textContent = 'Đang Hoạt Động';
                } else {
                    badge.className = 'badge bg-danger';
                    badge.textContent = 'Đang Bị Khóa';
                }

                const contextPath = [[@{/}]]+ 'admin/users/';
            document.getElementById('updateRoleForm').action = contextPath + id + '/update-role';

            const myModal = new bootstrap.Modal(document.getElementById('userModal'));
            myModal.show();
            }
        </script>
    </div>

</body>

</html>
