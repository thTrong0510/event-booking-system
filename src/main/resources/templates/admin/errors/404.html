<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout :: main-layout(~{:: #error404Content}, ~{:: title})}">
<head>
    <title>404 Không Tìm Thấy Trang - Ticket Admin</title>
</head>
<body>

    <div id="error404Content" class="container py-5">
        <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
            <div class="col-md-6 text-center">
                <!-- Icon & Mã lỗi minh họa trực quan -->
                <div class="display-1 fw-bold text-secondary mb-2">404</div>
                <h2 class="fw-semibold text-dark mb-3">Không Tìm Thấy Trang Yêu Cầu</h2>
                
                <p class="text-muted mb-4 fs-6">
                    Đường dẫn bạn đang truy cập không tồn tại, đã bị xóa hoặc bạn nhập sai địa chỉ URL. 
                    Vui lòng kiểm tra lại hoặc sử dụng menu bên cạnh để quay lại hệ thống.
                </p>
                
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a th:href="@{/admin/dashboard}" class="btn btn-primary px-4 py-2 shadow-sm">
                        <i class="bi bi-house-door-fill me-2"></i> Quay về Dashboard
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-arrow-left me-2"></i> Quay lại trang trước
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
